<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0118">
<title>💌 For You</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --rose:    #ff2d6e;
  --pink:    #ff7eb3;
  --gold:    #ffd166;
  --deep:    #0d0118;
  --card-bg: rgba(255,255,255,0.06);
  --glow:    rgba(255,45,110,0.45);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background: var(--deep);
  font-family: 'Quicksand', sans-serif;
  touch-action: none;
}

/* ── Canvas bg ── */
#cvs {
  position:fixed; inset:0;
  z-index:0;
  pointer-events:none;
}

/* ── Aurora bg ── */
.aurora {
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(255,45,110,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(130,30,200,0.2) 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,126,179,0.08) 0%, transparent 70%);
  animation: auroraShift 8s ease-in-out infinite alternate;
}
@keyframes auroraShift {
  0%   { opacity:.7; transform:scale(1) rotate(0deg); }
  100% { opacity:1;  transform:scale(1.08) rotate(2deg); }
}

/* ── Centering wrapper ── */
#scene {
  position:fixed; inset:0; z-index:10;
  display:flex; align-items:center; justify-content:center;
  padding:16px;
}

/* ── Card ── */
.card {
  width:100%; max-width:360px;
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius:32px;
  border:1.5px solid rgba(255,120,170,0.25);
  padding:44px 32px 40px;
  text-align:center;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04) inset,
    0 30px 80px rgba(0,0,0,0.6),
    0 0 60px var(--glow);
  animation: cardIn 0.7s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
@keyframes cardIn {
  from { transform:scale(0.4) translateY(60px); opacity:0; }
  to   { transform:scale(1)   translateY(0);    opacity:1; }
}
.card::before {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 60%);
  pointer-events:none;
  border-radius:32px;
}

/* Glowing ring */
.card::after {
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:34px;
  background: conic-gradient(from 0deg, transparent 60%, rgba(255,45,110,0.6) 75%, transparent 90%);
  animation: ringRotate 3s linear infinite;
  z-index:-1;
  filter:blur(4px);
}
@keyframes ringRotate { to { transform:rotate(360deg); } }

/* ── Question Screen ── */
#qScreen { transition: opacity .4s, transform .4s; }

.emoji-wrap {
  position:relative;
  width:90px; height:90px;
  margin:0 auto 18px;
}
.emoji-main {
  font-size:3.8rem;
  line-height:90px;
  display:block;
  text-align:center;
  animation: heartbeat 1.8s ease-in-out infinite;
  position:relative; z-index:2;
}
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  14%     { transform: scale(1.25); }
  28%     { transform: scale(1); }
  42%     { transform: scale(1.18); }
  56%     { transform: scale(1); }
}
.emoji-ring {
  position:absolute; inset:0;
  border-radius:50%;
  background: radial-gradient(circle, rgba(255,45,110,0.3) 0%, transparent 70%);
  animation: pulseRing 1.8s ease-in-out infinite;
}
@keyframes pulseRing {
  0%,100% { transform:scale(0.8); opacity:.6; }
  50%     { transform:scale(1.4); opacity:0; }
}

.main-title {
  font-family:'Playfair Display', serif;
  font-size:1.75rem;
  color:#fff;
  margin-bottom:6px;
  line-height:1.3;
}
.main-sub {
  font-size:.82rem;
  color:rgba(255,180,210,0.7);
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  margin-bottom:22px;
}

.question-text {
  font-size:1.25rem;
  font-weight:700;
  color:rgba(255,255,255,0.9);
  margin-bottom:32px;
  min-height:58px;
  line-height:1.6;
  transition: all .4s;
}

/* ── Buttons ── */
.btn-row {
  display:flex;
  gap:12px;
  justify-content:center;
  align-items: center;
  flex-wrap:nowrap; /* Keeps buttons strictly side-by-side */
}

#yesBtn {
  flex:1; min-width:110px; max-width:160px;
  padding:15px 20px;
  border:none;
  border-radius:50px;
  font-family:'Quicksand',sans-serif;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  background: linear-gradient(135deg, #ff2d6e, #ff7eb3);
  color:#fff;
  box-shadow: 0 8px 24px rgba(255,45,110,0.5), 0 0 0 0 rgba(255,45,110,0.4);
  transition: transform .15s, box-shadow .15s, min-width .4s, font-size .4s;
  animation: yesPulse 2s ease-in-out infinite;
}
@keyframes yesPulse {
  0%,100% { box-shadow: 0 8px 24px rgba(255,45,110,0.5), 0 0 0 0 rgba(255,45,110,0.4); }
  50%     { box-shadow: 0 8px 24px rgba(255,45,110,0.5), 0 0 0 10px rgba(255,45,110,0); }
}
#yesBtn:active { transform:scale(0.93); }

#noBtn {
  flex:1; min-width:110px; max-width:160px;
  padding:15px 20px;
  border: 1.5px solid rgba(255,100,150,0.4);
  border-radius:50px;
  font-family:'Quicksand',sans-serif;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  background: rgba(255,255,255,0.07);
  color:rgba(255,150,190,0.9);
  transition: transform .15s, background .2s;
}
#noBtn:active:not(.runaway) { transform:scale(0.93); background:rgba(255,80,130,0.15); }

#noBtn.runaway {
  position:fixed !important;
  z-index:9999;
  transition: top .12s cubic-bezier(0.34,1.56,0.64,1), left .12s cubic-bezier(0.34,1.56,0.64,1) !important;
  pointer-events:auto;
}

/* ── Yes grows, No shrinks ── */
.grow-yes { font-size:1.15rem !important; min-width:130px !important; }
.grow-yes2 { font-size:1.3rem !important; min-width:150px !important; }
.grow-yes3 { font-size:1.5rem !important; min-width:170px !important; }
.shrink-no { font-size:.85rem !important; min-width:90px !important; opacity:.7; }
.shrink-no2 { font-size:.72rem !important; min-width:76px !important; opacity:.5; }
.shrink-no3 { font-size:.6rem !important; min-width:62px !important; opacity:.3; }

/* ── Success Screen ── */
#winScreen {
  display:none;
  animation: cardIn .6s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
#winScreen.show { display:block; }

.win-hearts {
  font-size:3.5rem;
  margin-bottom:16px;
  display:block;
  animation: heartbeat 1.4s ease-in-out infinite;
}
.win-title {
  font-family:'Playfair Display',serif;
  font-size:2rem;
  color:#fff;
  margin-bottom:8px;
}
.win-sub {
  font-size:.82rem;
  color:rgba(255,180,210,0.7);
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:18px;
}
.win-msg {
  font-size:1rem;
  color:rgba(255,255,255,0.75);
  line-height:1.9;
  font-weight:500;
}
.win-divider {
  width:60px; height:2px;
  background: linear-gradient(90deg, transparent, var(--rose), transparent);
  margin:18px auto;
  border-radius:2px;
}

/* ── Stage transition ── */
.stage-out {
  animation: stageOut .25s forwards;
}
.stage-in {
  animation: stageIn .35s .1s both;
}
@keyframes stageOut {
  to { opacity:0; transform:translateY(-15px) scale(.97); }
}
@keyframes stageIn {
  from { opacity:0; transform:translateY(18px) scale(.97); }
  to   { opacity:1; transform:translateY(0)    scale(1); }
}

/* ── Ripple ── */
.ripple {
  position:fixed; border-radius:50%;
  background: rgba(255,45,110,0.25);
  pointer-events:none; z-index:999;
  animation: rippleOut .6s ease-out forwards;
  transform:translate(-50%,-50%);
}
@keyframes rippleOut {
  from { width:0; height:0; opacity:.8; }
  to   { width:200px; height:200px; opacity:0; }
}

/* ── Confetti ── */
.conf {
  position:fixed;
  pointer-events:none;
  z-index:9998;
  border-radius:3px;
  animation: confFall linear forwards;
}
@keyframes confFall {
  0%   { transform: translateY(0) rotate(0deg) scale(1); opacity:1; }
  80%  { opacity:1; }
  100% { transform: translateY(90vh) rotate(800deg) scale(.4); opacity:0; }
}
</style>
</head>
<body>

<canvas id="cvs"></canvas>
<div class="aurora"></div>

<div id="scene">
  <div class="card" id="card">

    <div id="qScreen">
      <div class="emoji-wrap">
        <div class="emoji-ring"></div>
        <span class="emoji-main" id="mEmoji">🥺</span>
      </div>
      <h1 class="main-title" id="mTitle">Hey, you...</h1>
      <p class="main-sub" id="mSub">I have something to ask 💌</p>
      <p class="question-text" id="mQ">Do you love me?</p>
      <div class="btn-row">
        <button id="yesBtn" onclick="onYes()">Yes 💖</button>
        <button id="noBtn">No 😒</button>
      </div>
    </div>

    <div id="winScreen">
      <span class="win-hearts">💖</span>
      <h1 class="win-title">Yaaayyy!! 🎉</h1>
      <p class="win-sub">I knew it!</p>
      <div class="win-divider"></div>
      <p class="win-msg">
        You make my heart go<br>
        <em style="font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--pink)">completely crazy.</em><br><br>
        ❤️ Forever &amp; Always ❤️
      </p>
    </div>

  </div>
</div>

<script>
/* ════════════════════════════════
   CANVAS PARTICLE SYSTEM
   ════════════════════════════════ */
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');

function resize() {
  cvs.width  = window.innerWidth;
  cvs.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const HEART_CHARS = ['❤','💕','✦','·','✧','♡'];
const particles = [];

class Particle {
  constructor() { this.reset(true); }
  reset(init=false) {
    this.x    = Math.random() * cvs.width;
    this.y    = init ? Math.random() * cvs.height : cvs.height + 20;
    this.vy   = -(0.4 + Math.random() * 0.9);
    this.vx   = (Math.random() - 0.5) * 0.4;
    this.size = 8 + Math.random() * 18;
    this.alpha= 0;
    this.targetAlpha = 0.1 + Math.random() * 0.35;
    this.char = HEART_CHARS[Math.floor(Math.random() * HEART_CHARS.length)];
    this.rot  = Math.random() * Math.PI * 2;
    this.rotV = (Math.random() - 0.5) * 0.02;
    this.life = 0;
    this.maxLife = 180 + Math.random() * 200;
    this.fadeIn  = 40;
    this.fadeOut = 40;
    const hues = [340, 350, 15, 45];
    this.hue = hues[Math.floor(Math.random() * hues.length)];
    this.sat = 70 + Math.random() * 30;
    this.lit = 70 + Math.random() * 20;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.rot += this.rotV;
    this.life++;
    if      (this.life < this.fadeIn)                        this.alpha = (this.life / this.fadeIn) * this.targetAlpha;
    else if (this.life > this.maxLife - this.fadeOut)        this.alpha = ((this.maxLife - this.life) / this.fadeOut) * this.targetAlpha;
    else                                                     this.alpha = this.targetAlpha;
    if (this.life >= this.maxLife || this.y < -30) this.reset();
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = `hsl(${this.hue},${this.sat}%,${this.lit}%)`;
    ctx.font = `${this.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.char, 0, 0);
    ctx.restore();
  }
}

for (let i = 0; i < 55; i++) particles.push(new Particle());

function animLoop() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animLoop);
}
animLoop();

/* ════════════════════════════════
   PRANK LOGIC
   ════════════════════════════════ */
const stages = [
  { emoji:'😢', title:'Are you sure?',        sub:'Think again, please...', q:'Come on... Are you really sure? 💔'         },
  { emoji:'😭', title:'Please reconsider!!',  sub:'My heart is shattering...', q:'Not even a tiny little bit?? 😭💔'         },
  { emoji:'🤡', title:'Okay okay...',          sub:'Last chance, I swear 😤',   q:'This is your FINAL answer?? 🥹🙏'         },
  { emoji:'😈', title:'Try clicking No now!', sub:'Good luck with that 😂',    q:'The No button is afraid of you! 😂'       },
];

let noCount   = 0;
let runaway   = false;

const noBtn   = document.getElementById('noBtn');
const yesBtn  = document.getElementById('yesBtn');
const mEmoji  = document.getElementById('mEmoji');
const mTitle  = document.getElementById('mTitle');
const mSub    = document.getElementById('mSub');
const mQ      = document.getElementById('mQ');
const qScreen = document.getElementById('qScreen');

noBtn.addEventListener('touchstart', handleNo, { passive:false });
noBtn.addEventListener('click',      handleNo);

function handleNo(e) {
  if (runaway) {
    if (e.cancelable) e.preventDefault();
    e.stopPropagation();
    teleportNo();
    return;
  }
  noCount++;
  updateStage();
}

function updateStage() {
  const s = stages[Math.min(noCount - 1, stages.length - 1)];

  qScreen.classList.add('stage-out');
  setTimeout(() => {
    mEmoji.textContent = s.emoji;
    mTitle.textContent = s.title;
    mSub.textContent   = s.sub;
    mQ.textContent     = s.q;

    const yClasses = ['', 'grow-yes', 'grow-yes2', 'grow-yes3'];
    const nClasses = ['', 'shrink-no', 'shrink-no2', 'shrink-no3'];
    yesBtn.className = yClasses[Math.min(noCount, 3)];
    if (!runaway) {
      noBtn.className = nClasses[Math.min(noCount, 3)];
    }

    qScreen.classList.remove('stage-out');
    qScreen.classList.add('stage-in');
    setTimeout(() => qScreen.classList.remove('stage-in'), 400);
  }, 260);

  if (noCount >= 3) activateRunaway();
}

/* ── RUNAWAY LOGIC ── */
function activateRunaway() {
  runaway = true;

  const rect = noBtn.getBoundingClientRect();
  noBtn.classList.add('runaway');
  noBtn.style.width  = rect.width + 'px';
  noBtn.style.height = rect.height + 'px';
  noBtn.style.left   = rect.left + 'px';
  noBtn.style.top    = rect.top  + 'px';
  document.body.appendChild(noBtn);
  
  /* The flee-on-hover logic was removed here so it only teleports on tap! */
}

function teleportNo() {
  const w = noBtn.offsetWidth  || 62;
  const h = noBtn.offsetHeight || 40;
  const nx = 10 + Math.random() * (window.innerWidth  - w - 20);
  const ny = 10 + Math.random() * (window.innerHeight - h - 20);
  noBtn.style.left = nx + 'px';
  noBtn.style.top  = ny + 'px';
  noBtn.style.transform = 'scale(1.15)';
  setTimeout(() => noBtn.style.transform = '', 150);
}

/* ── YES BUTTON ── */
function onYes() {
  rippleAt(event);
  runaway = false;
  noBtn.style.display = 'none';

  qScreen.classList.add('stage-out');
  setTimeout(() => {
    qScreen.style.display  = 'none';
    document.getElementById('winScreen').classList.add('show');
  }, 300);

  launchConfetti();
  burstHearts();
}

function rippleAt(e) {
  const r = document.createElement('div');
  r.className = 'ripple';
  const src = e.touches ? e.touches[0] : e;
  r.style.left = (src ? src.clientX : window.innerWidth/2) + 'px';
  r.style.top  = (src ? src.clientY : window.innerHeight/2) + 'px';
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 700);
}

function launchConfetti() {
  const colors = ['#ff2d6e','#ffd166','#ff7eb3','#c77dff','#48cae4','#ffffff','#ff9f1c'];
  const shapes = ['circle','rect'];
  for (let i = 0; i < 90; i++) {
    const c   = document.createElement('div');
    c.className = 'conf';
    const sz  = 6 + Math.random() * 10;
    const col = colors[Math.floor(Math.random() * colors.length)];
    const sh  = shapes[Math.floor(Math.random() * shapes.length)];
    c.style.cssText = `
      left:${10 + Math.random()*80}vw;
      top:${-10 + Math.random()*20}vh;
      width:${sz}px; height:${sz * (sh==='rect' ? 2.5 : 1)}px;
      background:${col};
      border-radius:${sh==='circle' ? '50%' : '2px'};
      animation-duration:${1.2 + Math.random()*1.4}s;
      animation-delay:${Math.random()*.5}s;
      opacity:1;
    `;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2800);
  }
}

function burstHearts() {
  const ox = cvs.width / 2, oy = cvs.height / 2;
  const burst = [];
  for (let i = 0; i < 30; i++) {
    const angle = (Math.PI * 2 / 30) * i + Math.random() * 0.3;
    burst.push({
      x: ox, y: oy,
      vx: Math.cos(angle) * (2 + Math.random() * 5),
      vy: Math.sin(angle) * (2 + Math.random() * 5),
      size: 18 + Math.random() * 22,
      alpha: 1,
      char: ['❤','💖','💕','💗','✨'][Math.floor(Math.random()*5)],
      hue: 340 + Math.random()*40,
    });
  }
  let frame = 0;
  function drawBurst() {
    frame++;
    burst.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.08;
      p.alpha -= 0.018;
      if (p.alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.font = `${p.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.char, p.x, p.y);
      ctx.restore();
    });
    if (frame < 90) requestAnimationFrame(drawBurst);
  }
  drawBurst();
}
</script>
</body>
</html>
